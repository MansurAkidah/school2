services:
  - type: web
    name: react-face-auth-frontend
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run preview
    staticPublishPath: dist
    envVars:
      - key: VITE_WS_URL
        value: ${VITE_WS_URL}
    plan: free
    buildFilter:
      paths:
        - "src/**"
        - "public/**"
        - "vite.config.js"
        - "package.json"
        - "package-lock.json"

  - type: web
    name: react-face-auth-backend
    env: node
    buildCommand: cd server && npm install
    startCommand: cd server && node index.js
    envVars:
      - key: DB_HOST
        value: ${DB_HOST}
      - key: DB_USER
        value: ${DB_USER}
      - key: DB_PASSWORD
        value: ${DB_PASSWORD}
      - key: DB_NAME
        value: ${DB_NAME}
      - key: SERVER_PORT
        value: ${SERVER_PORT}
    plan: free
    buildFilter:
      paths:
        - "server/**" 